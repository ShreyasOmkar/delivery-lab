name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io  # Using GitHub Container Registry for demo
  IMAGE_NAME: delivery-lab
  NAMESPACE: default

jobs:
# Test & Validate 
  test-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # To comment on PRs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing
      
      - name: Run linting (flake8)
        run: |
          pip install flake8
          flake8 app.py tests/ --max-line-length=120 --statistics
      
      - name: Validate Kubernetes manifests
        uses: danielr1996/kubeval-action@master
        with:
          files: k8s/
          version: 1.28
          strict: true
          ignore_missing_schemas: true
      
      - name: Basic security configuration check
        run: |
          # Check Dockerfile for non-root user
          grep -q "USER appuser" Dockerfile || (echo "ERROR: Dockerfile missing USER appuser" && exit 1)
          
          # Check for hardcoded secrets in k8s files
          if grep -r "password\|secret\|token\|key" k8s/ --include="*.yaml" | grep -v "ENV"; then
            echo "ERROR: Potential hardcoded secret found in k8s manifests"
            exit 1
          fi
          
          # Check ConfigMap doesn't contain sensitive data
          if grep -r "READY: \"true\"" k8s/configmap.yaml; then
            echo "✓ ConfigMap looks clean"
          fi
      
      - name: Build Docker image (test build)
        run: |
          docker build -t $IMAGE_NAME:test-${{ github.sha }} .
          docker image inspect $IMAGE_NAME:test-${{ github.sha }}
      
      - name: Run container security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      
      - name: Comment PR on success/failure
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const conclusion = '${{ job.status }}';
            const message = conclusion === 'success' 
              ? '✅ All tests passed! Ready for review.' 
              : '❌ Tests failed. Please check the logs.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  # Build & Deploy
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      id-token: write 
      packages: write 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Update Kubernetes manifests with image tag
        run: |
          sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/deployment.yaml
          cat k8s/deployment.yaml
      
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
      
      - name: Verify rollout status
        run: |
          kubectl rollout status deployment/delivery-lab -n ${{ env.NAMESPACE }} --timeout=3m
          echo "✅ Deployment successful!"
      
      - name: Get deployment status
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=delivery-lab
          kubectl get svc,endpoints -n ${{ env.NAMESPACE }} | grep delivery-lab

# Run Smoke Tests
  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always() && needs.build-and-deploy.result == 'success'
    
    steps:
      - name: Test service endpoint
        run: |
          # Port-forward to access the service
          kubectl port-forward svc/delivery-lab 8080:80 -n ${{ env.NAMESPACE }} &
          sleep 5
          
          # Run smoke tests
          echo "Testing health endpoint..."
          curl -f http://localhost:8080/health/live || exit 1
          echo "✓ Liveness OK"
          
          curl -f http://localhost:8080/health/ready || exit 1
          echo "✓ Readiness OK"
          
          curl -f http://localhost:8080/ | grep delivery-lab || exit 1
          echo "✓ Service OK"
          
          echo "✅ Smoke tests passed!"