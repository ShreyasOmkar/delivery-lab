apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-lab
  namespace: default
  labels:
    app: delivery-lab
    version: stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery-lab
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%        
      maxUnavailable: 25%  
  revisionHistoryLimit: 5  
  template:
    metadata:
      labels:
        app: delivery-lab
        version: stable
    spec:
    # Security context 
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
      - name: app
        image: delivery-lab:latest 
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        
        #Variables from ConfigMap
        env:
        - name: APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: delivery-lab-config
              key: APP_VERSION
        
        # Resource necesasry requests and limits
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "150m"
        
        # Liveness Probe
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        # Readiness Probe 
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        # Lifecycle for graceful shutdown
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
      
      # termination period
      terminationGracePeriodSeconds: 30
      
      # Pod anti-affinity 
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - delivery-lab
              topologyKey: kubernetes.io/hostname