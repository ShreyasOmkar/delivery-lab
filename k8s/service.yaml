apiVersion: v1
kind: Service
metadata:
  name: delivery-lab
  namespace: default
  labels:
    app: delivery-lab
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: delivery-lab
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP